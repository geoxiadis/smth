[build-system]
requires = [
    "setuptools>=60",
    "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"


[project]
name = "py_wake"
authors = [
  { name="DTU Wind Energy"},
  { name="Mads M. Pedersen", email="mmpe@dtu.dk" },
]
description = "Open source static wake modeling framework from DTU"
readme = "README.md"
license = {text = "MIT License"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
  "git-lfs",
  "matplotlib",
  "numpy",
  "xarray>=2024.6.1", "netcdf4", "h5netcdf",
  "pandas[hdf5,excel]",
  "autograd",
  "pyyaml",
  "scipy",
  "tqdm",
  "joblib>=1.3",
  "pooch",          
]
dynamic = ["version"]

[project.urls]
'Documentation'= 'https://topfarm.pages.windenergy.dtu.dk/PyWake/'
'Changelog'= 'https://topfarm.pages.windenergy.dtu.dk/PyWake/notebooks/ChangeLog.html'
'Source code'= 'https://gitlab.windenergy.dtu.dk/TOPFARM/PyWake'
'Issue tracker'= 'https://gitlab.windenergy.dtu.dk/TOPFARM/PyWake/-/issues'

[project.optional-dependencies]

test  = [ 'pytest',  # for testing
          'pytest-cov',  # for calculating coverage
          'psutil',  # memory profiling
          'memory_profiler',  # memory profiling
          'line_profiler',  # to check speed
          'scikit-learn',  # MinMaxScaler
          'surrogates-interface',
          "tensorflow>=2.0; python_version<'3.14'",  # load surrogates
          'ipywidgets',  # notebook widgets
          'windkit',
          'zarr',
          'geopandas',
          'pip-system-certs',  # to avoid [SSL: CERTIFICATE_VERIFY_FAILED] certificate verify failed: unable to get local issuer certificate
        ] 
docs = [
          'sphinx',  # generating documentation
          'sphinx_rtd_theme',  # docs theme
          'ipywidgets',  # notebook widgets
          "numpydoc", 
          "nbsphinx", 
          "sphinx_copybutton", 
          "sphinx_sitemap", 
          "ipympl", 
          "ipykernel",
          "pypandoc",
          'topfarm>=2.5',
          'windkit',
          'geopandas',
        ]

lint = [
  "pycodestyle",
]

parallel = [
  "mpi4py",
  "openmpi",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]


[tool.setuptools.package-data]
py_wake = ['examples/data/iea37/*.yaml',
           'examples/data/*.npz',
           'tests/test_files/fuga/2MW/Z0=0.03000000Zi=00401Zeta0=0.00E+00.nc',
           'examples/data/iea34_130rwt/*/*/*.h5',
           'examples/data/iea34_130rwt/*/*/*.json',
           'examples/data/ParqueFicticio/*.grd',
           'examples/data/NEG-Micon-2750.wtg',
           'examples/data/Vestas V112-3.0 MW.wtg',
           'rotor_avg_models/gaussian_overlap_.02_.02_128_512.nc',
           'examples/data/dtu10mw_surrogate/one_turbine/*.h5',
           'wind_farm_models/Regression_model',
           'wind_farm_models/PolynomialFeature_model',
           ]

[tool.setuptools_scm]
version_file = "py_wake/version.py"


[tool.ruff.lint]
select = ['E', 'W']
extend-ignore = ["E741"]
preview = true

[tool.ruff.lint.pycodestyle]
max-line-length = 150

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]  # "osx-arm64"
requires-pixi = ">=0.67"  # For exclude-newer.
exclude-newer = "1month"  # For safety.

[tool.pixi.pypi-dependencies]
py_wake = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
python = "3.12.*"  # This is the python version that we use for testing.

[tool.pixi.environments]
default = { solve-group = "default" }
docs = { features = ["docs", "test"], solve-group = "default" }
lint = { features = ["lint"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
parallel = { features = ["parallel"], solve-group = "default" }
dev = { features = ["docs", "test", "lint"], solve-group = "default" }

[tool.pixi.tasks]
